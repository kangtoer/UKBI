<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Akses UKBI - SMP PGRI 1 Kuwarasan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-blue-900 via-slate-900 to-indigo-950 min-h-screen text-slate-100 font-sans flex flex-col justify-between p-4">

  <!-- Header Section -->
  <header class="max-w-xl mx-auto w-full pt-6 text-center space-y-2">
    <div class="inline-flex items-center space-x-2 bg-blue-500/20 border border-blue-400/30 px-3 py-1 rounded-full text-xs font-semibold text-blue-300 backdrop-blur-md">
      <i class="fa-solid fa-graduation-cap"></i>
      <span>Tahun Ajaran 2026/2027</span>
    </div>
    <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-white">Portal Akses UKBI Siswa</h1>
    <p class="text-slate-400 text-sm">SMP PGRI 1 Kuwarasan</p>
  </header>

  <!-- Main Content Card -->
  <main class="max-w-xl mx-auto w-full bg-slate-800/80 backdrop-blur-xl border border-slate-700/60 rounded-3xl p-6 md:p-8 shadow-2xl my-6 space-y-6">
    
    <!-- Input Form -->
    <div class="space-y-4">
      <label for="nisnInput" class="block text-sm font-medium text-slate-300">
        Masukkan NISN Siswa
      </label>
      <div class="relative">
        <input type="number" id="nisnInput" placeholder="Contoh: 0081234567" 
               class="w-full bg-slate-900/90 border border-slate-600 rounded-xl px-4 py-3.5 pl-11 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
        <i class="fa-solid fa-id-card absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
      </div>
      <button onclick="cariDataSiswa()" id="btnCari" 
              class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-blue-500/25 transition duration-200 flex justify-center items-center space-x-2">
        <i class="fa-solid fa-magnifying-glass"></i>
        <span>Cari Data Akun UKBI</span>
      </button>
    </div>

    <!-- Alert / Status Error -->
    <div id="statusAlert" class="hidden p-4 rounded-xl text-sm font-medium border text-center"></div>

    <!-- Result View -->
    <div id="resultCard" class="hidden space-y-6 pt-4 border-t border-slate-700/60 transition-all duration-300">
      
      <!-- Profile Box -->
      <div class="flex items-center space-x-4 bg-slate-900/60 p-4 rounded-2xl border border-slate-700/50">
        <img id="imgFoto" src="" alt="Foto Siswa" 
             class="w-20 h-20 rounded-2xl object-cover border-2 border-blue-500/80 shadow-md bg-slate-800"
             onerror="this.src='https://via.placeholder.com/150/1e293b/94a3b8?text=FOTO'">
        <div class="space-y-1 overflow-hidden">
          <h2 id="txtNama" class="text-lg font-bold text-white truncate">-</h2>
          <p class="text-xs text-blue-400 font-medium"><i class="fa-solid fa-school mr-1"></i><span id="txtKelas">-</span></p>
          <p class="text-xs text-slate-400"><i class="fa-solid fa-hashtag mr-1"></i>NISN: <span id="txtNISN">-</span></p>
        </div>
      </div>

      <!-- Credentials Box -->
      <div class="space-y-3">
        <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Kredensial Login Simulasi UKBI</p>
        
        <div class="bg-slate-900/80 p-3.5 rounded-xl border border-slate-700/60 flex items-center justify-between">
          <div>
            <p class="text-xs text-slate-400">Username UKBI</p>
            <p id="txtUsername" class="font-mono font-bold text-blue-300 text-base">-</p>
          </div>
          <button onclick="salinTeks('txtUsername')" class="text-slate-400 hover:text-white p-2 rounded-lg hover:bg-slate-800 transition">
            <i class="fa-regular fa-copy"></i>
          </button>
        </div>

        <div class="bg-slate-900/80 p-3.5 rounded-xl border border-slate-700/60 flex items-center justify-between">
          <div>
            <p class="text-xs text-slate-400">Password / PIN</p>
            <p id="txtPassword" class="font-mono font-bold text-emerald-400 text-base">-</p>
          </div>
          <button onclick="salinTeks('txtPassword')" class="text-slate-400 hover:text-white p-2 rounded-lg hover:bg-slate-800 transition">
            <i class="fa-regular fa-copy"></i>
          </button>
        </div>
      </div>

      <!-- Action Redirect Button -->
      <a href="https://ukbi.kemendikdasmen.go.id/simulasi" target="_blank" rel="noopener noreferrer" 
         class="block text-center w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-emerald-600/25 transition duration-200">
        Masuk Simulasi UKBI Kemendikdasmen <i class="fa-solid fa-arrow-right-long ml-2"></i>
      </a>
    </div>

  </main>

  <footer class="text-center text-xs text-slate-500 pb-4">
    &copy; 2026 SMP PGRI 1 Kuwarasan. All rights reserved.
  </footer>

  <script>
    // MASUKKAN URL GOOGLE APPS SCRIPT DI SINI:
    const API_URL = "https://script.google.com/macros/s/AKfycbzUxpoD1jw2DiffTVQcfvhTbBPK8jdjPJWCKxrqdKDBmGPBy6BknkAZKbl4jgj4o9GX1w/exec";

    async function cariDataSiswa() {
      const inputVal = document.getElementById('nisnInput').value.trim();
      const statusAlert = document.getElementById('statusAlert');
      const resultCard = document.getElementById('resultCard');
      const btnCari = document.getElementById('btnCari');

      if (!inputVal) {
        tampilkanStatus('Silakan masukkan NISN terlebih dahulu.', 'bg-amber-500/10 border-amber-500/30 text-amber-400');
        return;
      }

      // UI Loading state
      btnCari.disabled = true;
      btnCari.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> <span>Mencari Data...</span>`;
      statusAlert.classList.add('hidden');
      resultCard.classList.add('hidden');

      try {
        const response = await fetch(API_URL);
        const dataSiswa = await response.json();

        // Matching NISN
        const siswa = dataSiswa.find(s => s.nisn === inputVal);

        if (siswa) {
          document.getElementById('txtNama').innerText = siswa.nama;
          document.getElementById('txtKelas').innerText = siswa.kelas;
          document.getElementById('txtNISN').innerText = siswa.nisn;
          document.getElementById('txtUsername').innerText = siswa.username;
          document.getElementById('txtPassword').innerText = siswa.password;
          
          // Konversi Drive Foto URL/ID
          if (siswa.foto) {
            let fileId = siswa.foto.includes('id=') ? siswa.foto.split('id=')[1] : siswa.foto.split('/d/')[1]?.split('/')[0] || siswa.foto;
            document.getElementById('imgFoto').src = `https://lh3.googleusercontent.com/d/${fileId}`;
          }

          resultCard.classList.remove('hidden');
        } else {
          tampilkanStatus('Data NISN tidak ditemukan. Pastikan nomor NISN sudah benar.', 'bg-rose-500/10 border-rose-500/30 text-rose-400');
        }
      } catch (error) {
        tampilkanStatus('Gagal mengambil data. Pastikan URL API Apps Script sudah benar.', 'bg-rose-500/10 border-rose-500/30 text-rose-400');
      } finally {
        btnCari.disabled = false;
        btnCari.innerHTML = `<i class="fa-solid fa-magnifying-glass"></i> <span>Cari Data Akun UKBI</span>`;
      }
    }

    function tampilkanStatus(pesan, kelasCSS) {
      const statusAlert = document.getElementById('statusAlert');
      statusAlert.className = `p-4 rounded-xl text-sm font-medium border text-center ${kelasCSS}`;
      statusAlert.innerText = pesan;
      statusAlert.classList.remove('hidden');
    }

    function salinTeks(elementId) {
      const teks = document.getElementById(elementId).innerText;
      navigator.clipboard.writeText(teks);
      alert('Teks berhasil disalin: ' + teks);
    }
  </script>
</body>
</html>
